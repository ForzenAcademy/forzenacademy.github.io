<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Monster Bestiary · Magitower Adventure</title><link rel="icon" href="../favicon.webp"><link rel="stylesheet" href="bestiary.css"><script type="module" src="bestiary.js"></script></head>
